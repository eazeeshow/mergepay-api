name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: npm test

  # Issue #646 — the integration suite runs against a real Postgres.
  #
  # It is a separate job rather than extra steps in `build-test` because it needs
  # a database the unit suite must not have: `npm test` replaces `src/db` with a
  # mock and must stay runnable with no service behind it. Keeping them apart also
  # means a red unit gate does not hide whether the flows themselves still work.
  #
  # `build-test` excludes `tests/` from `tsc`, so nothing else in CI compiles this
  # suite; the job therefore has no build step — Vitest transpiles it directly.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mergepay_test
        ports:
          - 5432:5432
        # The postgres image ships no HEALTHCHECK, so without this the runner
        # starts the job the instant the container is created, while Postgres is
        # still initialising, and the first connection is refused.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/mergepay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:integration
